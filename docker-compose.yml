services:
  postgres:
    image: postgres:16-alpine
    container_name: erasmus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erasmus
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: